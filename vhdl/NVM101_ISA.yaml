#
# Vector Logic
#

  VAND:
    category: "logic_vec"
    opcode: 0
    operation: "ALUOp_AND_C"
    behaviour: "R[rd] = R[rs1] AND R[rs2]"

  VANDI:
    category: "logic_vec_imm"
    opcode: 1
    operation: "ALUOp_AND_C"
    behaviour: "R[rd] = R[rs] AND zero_extend(value)"

  VXOR:
    category: "logic_vec"
    opcode: 2
    operation: "ALUOp_XOR_C"
    behaviour: "R[rd] = R[rs1] XOR R[rs2]"

  VXORI:
    category: "logic_vec_imm"
    opcode: 3
    operation: "ALUOp_XOR_C"
    behaviour: "R[rd] = R[rs] XOR zero_extend(value)"

  VADD:
    category: "logic_vec"
    opcode: 4
    operation: "ALUOp_ADD_C"
    behaviour: "R[rd] = R[rs1] + R[rs2]"

  VADDI:
    category: "logic_vec_imm"
    opcode: 5
    operation: "ALUOp_ADD_C"
    behaviour: "R[rd] = R[rs] + zero_extend(value)"

  VSUB:
    category: "logic_vec"
    opcode: 6
    operation: "ALUOp_SUB_C"
    behaviour: "R[rd] = R[rs1] - R[rs2]"

  VSUBI:
    category: "logic_vec_imm"
    opcode: 7
    operation: "ALUOp_SUB_C"
    behaviour: "R[rd] = R[rs] - zero_extend(value)"

  VOR:
    category: "logic_vec"
    opcode: 8
    operation: "ALUOp_OR_C"
    behaviour: "R[rd] = R[rs1] OR R[rs2]"

  VORI:
    category: "logic_vec_imm"
    opcode: 9
    operation: "ALUOp_OR_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"

  VLSLI:
    category: "logic_vec_imm"
    opcode: 10
    operation: "ALUOp_LSL_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"    

  VLSRI:
    category: "logic_vec_imm"
    opcode: 11
    operation: "ALUOp_LSR_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"

  VASRI:
    category: "logic_vec_imm"
    opcode: 12
    operation: "ALUOp_ASR_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"

#
