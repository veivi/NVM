    behaviour: "R[rd] = R[rs] OR zero_extend(value)"

#
# Jump Absolute / Indirect
#

  JMPA:
    category: "jump_imm"
    opcode: 0
    operation: "FlowOp_JMPA_C"
    behaviour: "IP = zero_extend(target)"
    
  JMPAL:
    category: "jump_imm"
    opcode: 1
    operation: "FlowOp_JMPAL_C"
    behaviour: "R0 = IP; IP = zero_extend(target)"

  JMP:
    category: "jump_ind"
    opcode: 2
    operation: "FlowOp_JMP_C"
    behaviour: "IP = R[rs] + sign_extend(i_disp)"
    
  JMPL:
    category: "jump_ind"
    opcode: 3
    operation: "FlowOp_JMPL_C"
    behaviour: "R0 = IP; IP = R[rs] + sign_extend(i_disp)"

