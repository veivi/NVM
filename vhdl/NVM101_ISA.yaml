architecture: "COP103"
version: "1.0"
iword_size_bits: 32
minimum_opcode: 6

#
# INSTRUCTION FORMATS
#

instruction_formats:
  nop: { opcode: 24 }
  system: { opcode: 16 }
  imm: { opcode: 6, value: 20, rd: 6 }
  logic: { opcode: 6, _: 8, rs2: 6, rs1: 6, rd: 6 }
  logic_imm: { opcode: 6, value: 14, rs: 6, rd: 6 }
  jump_imm: { opcode: 6, i_target : 26 }
  jump_ind: { opcode: 6, i_disp: 20, rs: 6 }
  compare: { opcode: 8, _: 6, rs2: 6, rs1: 6, _: 4, cr: 2 }
  compare_imm: { opcode: 8, value: 12, rs: 6, _: 4, cr: 2 }
  compare_vec: { opcode: 8, _: 6, vs2: 6, vs1: 6, _: 4, vcr: 2 }
  compare_vec_imm: { opcode: 8, value: 12, vs: 6, _: 4, vcr: 2 }
  loadstore: { opcode: 8, disp: 12, rs: 6, rd: 6 }
  loadstore_indexed: { opcode: 8, scale: 6, rs2: 6, rs1: 6, rd: 6 }
  logic_vec: { opcode: 10, _: 4, vs2: 6, vs1: 6, vd: 6 }
  logic_vec_imm: { opcode: 10, value: 10, vs: 6, vd: 6 }
  logic_vec_bc: { opcode: 10, _: 4, rs2: 6, vs1: 6, vd: 6 }
  branch: { opcode: 10, i_disp: 20, cr: 2 }
  loadstore_vec: { opcode: 14, rs2 : 6, rs1: 6, vd: 6 }
  loadstore_vec_imm: { opcode: 14, stride : 6, rs: 6, vd: 6 }
  debug: { opcode: 10, rs: 6 }
  debug_imm: { opcode: 10, value: 22 }
  ext: { opcode: 6, subop: 8, vs2 : 6, vs1: 6, vd: 6 }
  ext_bc: { opcode: 6, subop: 8, rs2 : 6, vs1: 6, vd: 6 }

#
# INSTRUCTION CATEGORIES
#

instruction_categories:
  imm_unsigned:
    format: "imm"
    prefix: 36
    operands: [ "rd", "value" ]
    unit: "Imm"
    imm-unsigned: "value"
    register-write: "rd"
    
  imm:
    format: "imm"
    prefix: 36
    operands: [ "rd", "value" ]
    unit: "Imm"
    imm-signed: "value"
    register-write: "rd"
    
  imm_high:
    format: "imm"
    prefix: 36
    operands: [ "rd", "value" ]
    unit: "Imm"
    imm-high: "value"
    register-write: "rd"
    
  logic:
    format: "logic"
    prefix: 0
    operands: [ "rd", "rs1", "rs2" ]
    unit: "ALU"
    mode: "ALU_RegReg_C"
    register-read-a: "rs1"
    register-read-b: "rs2"
    register-write: "rd"
    
  logic_imm:
    format: "logic_imm"
    prefix: 0
    operands: [ "rd", "rs", "value" ]
    unit: "ALU"
    mode: "ALU_RegImm_C"
    register-read-a: "rs"
    imm-unsigned: "value"
    register-write: "rd"
  
  compare:
    format: "compare"
    prefix: 32
    operands: [ "cr", "rs1", "rs2" ]
    unit: "ALU"
    mode: "ALU_RegReg_C"
    register-read-a: "rs1"
    register-read-b: "rs2"
    condition-write: "cr"
    
  compare_imm:
    format: "compare_imm"
    prefix: 32
    operands: [ "cr", "rs", "value" ]
    unit: "ALU"
    mode: "ALU_RegImm_C"
    register-read-a: "rs"
    imm-signed: "value"
    condition-write: "cr"
  
  compare_imm_unsigned:
    format: "compare_imm"
    prefix: 32
    operands: [ "cr", "rs", "value" ]
    unit: "ALU"
    mode: "ALU_RegImm_C"
    register-read-a: "rs"
    imm-unsigned: "value"
    condition-write: "cr"
  
  compare_vec:
    format: "compare_vec"
    prefix: 32
    operands: [ "vcr", "vs1", "s2" ]
    unit: "VALU"
    mode: "ALU_RegReg_C"
    vector-read-a: "vs1"
    vector-read-b: "vs2"
    vector-condition-write: "vcr"
    
  compare_vec_imm:
    format: "compare_vec_imm"
    prefix: 32
    operands: [ "vcr", "vs", "value" ]
    unit: "VALU"
    mode: "ALU_RegImm_C"
    vector-read-a: "vs"
    imm-signed: "value"
    vector-condition-write: "vcr"
  
  compare_vec_imm_unsigned:
    format: "compare_vec_imm"
    prefix: 32
    operands: [ "vcr", "vs", "value" ]
    unit: "VALU"
    mode: "ALU_RegImm_C"
    vector-read-a: "vs"
    imm-unsigned: "value"
    vector-condition-write: "vcr"
    
  loadstore:
    format: "loadstore"
    prefix: 40
    operands: [ "rd", "rs", "disp" ]
    unit: "LS"
    mode: "LS_Displaced_C"
    register-read-a: "rs"
    imm-unsigned: "disp"
    register-read-c: "rd"
    
  loadstore_indexed:
    format: "loadstore_indexed"
    prefix: 44
    operands: [ "rd", "rs1", "rs2" ]
    unit: "LS"
    mode: "LS_Indexed_C"
    register-read-a: "rs1"
    register-read-b: "rs2"
    imm-unsigned: "scale"
    register-read-c: "rd"
   
  loadstore_vec:
    format: "loadstore_vec"
    prefix: 48
    operands: [ "vd", "rs1", "rs2" ]
    unit: "VLS"
    mode: "VLS_Reg_C"
    register-read-a: "rs1"
    register-read-b: "rs2"
    vector-read-c: "vd"
    
  loadstore_vec_imm:
    format: "loadstore_vec_imm"
    prefix: 49
    operands: [ "vd", "rs", "stride" ]
    unit: "VLS"
    mode: "VLS_Imm_C"
    register-read-a: "rs"
    imm-unsigned: "stride"
    vector-read-c: "vd"
    
  jump_imm:
    format: "jump_imm"
    prefix: 50
    operands: [ "i_target" ]
    imm-unsigned: "i_target"
    unit: "FCU"
    
  jump_ind:
    format: "jump_ind"
    prefix: 51
    operands: [ "rs", "i_disp" ]
    imm-signed: "i_disp"
    register-read-a: "rs"
    unit: "FCU"

  debug_imm:
    format: "debug_imm"
    prefix: 56
    operands: [ "value" ]
    imm-unsigned: "value"
    unit: "Debug"

  debug:
    format: "debug"
    prefix: 56
    operands: [ "rs" ]
    register-read-a: "rs"
    unit: "Debug"

  cond_branch:
    format: "branch"
    prefix: 56
    operands: [ "cr", "i_disp" ]
    unit: "FCU"
    condition-read: "cr"
    imm-signed: "i_disp"
    
  branch:
    format: "branch"
    prefix: 56
    operands: [ "i_disp" ]
    unit: "FCU"
    imm-signed: "i_disp"
    
  logic_vec:
    format: "logic_vec"
    prefix: 60
    operands: [ "vd", "vs1", "vs2" ]
    unit: "VALU"
    mode: "ALU_RegReg_C"
    vector-read-a: "vs1"
    vector-read-b: "vs2"
    vector-write: "vd"
    
  logic_vec_imm:
    format: "logic_vec_imm"
    prefix: 60
    operands: [ "vd", "vs", "value" ]
    unit: "VALU"
    mode: "ALU_RegImm_C"
    vector-read-a: "vs"
    imm-unsigned: "value"
    vector-write: "vd"

  logic_vec_bc:
    format: "logic_vec_bc"
    prefix: 60
    operands: [ "vd", "vs1", "rs2" ]
    unit: "VALU"
    mode: "ALU_RegReg_C"
    vector-read-a: "vs1"
    register-read-b: "rs2"
    vector-write: "vd"
    
  ext:
    format: "ext"
    prefix: 58
    operands: [ "subop", "vd", "vs1", "vs2" ]
    unit: "Ext"
    sub-operation: "subop"
    vector-read-a: "vs1"
    vector-read-b: "vs2"
    vector-read-c: "vd"
    ext-result: "vd"

  ext_bc:
    format: "ext_bc"
    prefix: 59
    operands: [ "subop", "vd", "vs1", "rs2" ]
    unit: "Ext"
    sub-operation: "subop"
    vector-read-a: "vs1"
    register-read-b: "rs2"
    vector-read-c: "vd"
    ext-result: "vd"

  fence:
    format: "system"
    prefix: 63
    unit: "Fence"
    operands: []
    
  nop:
    format: "nop"
    prefix: 0

#
# INSTRUCTION SET
#

instruction_set:
  DRAIN:
    category: "fence"
    opcode: 0
    operation: "FenceOp_WriteFence_C"
    behaviour: "Memory Write fence"
  
  SYNC:
    category: "fence"
    opcode: 1
    operation: "FenceOp_ReadFence_C"
    behaviour: "Memory Read fence"
  
  FENCE:
    category: "fence"
    opcode: 2
    operation: "FenceOp_Fence_C"
    behaviour: "Memory fence"
  
  EXT:
    category: "ext"
    opcode: 0
    behaviour: "Extension"
    
  EXTB:
    category: "ext_bc"
    opcode: 0
    behaviour: "Extension"
    
  NOP:
    category: "nop"
    opcode: 0
    behaviour: "No operation"
    
  AND:
    category: "logic"
    opcode: 2
    operation: "ALUOp_AND_C"
    behaviour: "R[rd] = R[rs1] AND R[rs2]"

  ANDI:
    category: "logic_imm"
    opcode: 3
    operation: "ALUOp_AND_C"
    behaviour: "R[rd] = R[rs] AND zero_extend(value)"

  XOR:
    category: "logic"
    opcode: 10
    operation: "ALUOp_XOR_C"
    behaviour: "R[rd] = R[rs1] XOR R[rs2]"

  XORI:
    category: "logic_imm"
    opcode: 11
    operation: "ALUOp_XOR_C"
    behaviour: "R[rd] = R[rs] XOR zero_extend(value)"

  ADD:
    category: "logic"
    opcode: 4
    operation: "ALUOp_ADD_C"
    behaviour: "R[rd] = R[rs1] + R[rs2]"

  ADDI:
    category: "logic_imm"
    opcode: 5
    operation: "ALUOp_ADD_C"
    behaviour: "R[rd] = R[rs] + zero_extend(value)"

  SUB:
    category: "logic"
    opcode: 6
    operation: "ALUOp_SUB_C"
    behaviour: "R[rd] = R[rs1] - R[rs2]"

  SUBI:
    category: "logic_imm"
    opcode: 7
    operation: "ALUOp_SUB_C"
    behaviour: "R[rd] = R[rs] - zero_extend(value)"

  OR:
    category: "logic"
    opcode: 8
    operation: "ALUOp_OR_C"
    behaviour: "R[rd] = R[rs1] OR R[rs2]"

  ORI:
    category: "logic_imm"
    opcode: 9
    operation: "ALUOp_OR_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"

  LSL:
    category: "logic"
    opcode: 12
    operation: "ALUOp_LSL_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"    

  LSLI:
    category: "logic_imm"
    opcode: 13
    operation: "ALUOp_LSL_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"    

  LSR:
    category: "logic"
    opcode: 14
    operation: "ALUOp_LSR_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"

  LSRI:
    category: "logic_imm"
    opcode: 15
    operation: "ALUOp_LSR_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"

  ASR:
    category: "logic"
    opcode: 16
    operation: "ALUOp_ASR_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"

  ASRI:
    category: "logic_imm"
    opcode: 17
    operation: "ALUOp_ASR_C"
    behaviour: "R[rd] = R[rs] OR zero_extend(value)"

#
# Compare Scalar/Vector
#

  CMP:
    category: "compare"
    opcode: 0
    operation: "ALUOp_CMP_C"
    behaviour: "CR[cr] = COMPARE(R[rs1], R[rs2])"

  CMPI:
    category: "compare_imm"
    opcode: 1
    operation: "ALUOp_CMP_C"
    behaviour: "CR[cr] = COMPARE(R[rs], sign_extend(value))"

  CMPU:
    category: "compare"
    opcode: 2
    operation: "ALUOp_CMPU_C"
    behaviour: "CR[cr] = COMPARE(R[rs1], R[rs2])"

  CMPUI:
    category: "compare_imm_unsigned"
    opcode: 3
    operation: "ALUOp_CMPU_C"
    behaviour: "CR[cr] = COMPARE(R[rs], zero_extend(value))"

  VCMP:
    category: "compare_vec"
    opcode: 4
    operation: "ALUOp_CMP_C"
    behaviour: "CR[cr] = COMPARE(R[rs1], R[rs2])"

  VCMPI:
    category: "compare_vec_imm"
    opcode: 5
    operation: "ALUOp_CMP_C"
    behaviour: "CR[cr] = COMPARE(R[rs], sign_extend(value))"

  VCMPU:
    category: "compare_vec"
    opcode: 6
    operation: "ALUOp_CMPU_C"
    behaviour: "CR[cr] = COMPARE(R[rs1], R[rs2])"

  VCMPUI:
    category: "compare_vec_imm_unsigned"
    opcode: 7
    operation: "ALUOp_CMPU_C"
    behaviour: "CR[cr] = COMPARE(R[rs], zero_extend(value))"

#
# Conditional Branch
#

  BNE:
    category: "cond_branch"
    opcode: 0
    operation: "FlowOp_BNE_C"
    behaviour: "IP = IP + sign_extend(offset) IF CR[cr] NE"

  BEQ:
    category: "cond_branch"
    opcode: 1
    operation: "FlowOp_BEQ_C"
    behaviour: "IP = IP + sign_extend(offset) IF CR[cr] EQ"

  BLT:
    category: "cond_branch"
    opcode: 2
    operation: "FlowOp_BLT_C"
    behaviour: "IP = IP + sign_extend(offset) IF CR[cr] LT"

  BLE:
    category: "cond_branch"
    opcode: 3
    operation: "FlowOp_BLE_C"
    behaviour: "IP = IP + sign_extend(offset) IF CR[cr] LE"

  BGT:
    category: "cond_branch"
    opcode: 4
    operation: "FlowOp_BGT_C"
    behaviour: "IP = IP + sign_extend(offset) IF CR[cr] GT"

  BGE:
    category: "cond_branch"
    opcode: 5
    operation: "FlowOp_BGE_C"
    behaviour: "IP = IP + sign_extend(offset) IF CR[cr] GE"

  BA:
    category: "branch"
    opcode: 6
    operation: "FlowOp_BA_C"
    behaviour: "IP = IP + sign_extend(offset)"

  BL:
    category: "branch"
    opcode: 7
    operation: "FlowOp_BL_C"
    behaviour: "R0 = IP; IP = IP + sign_extend(offset)"

#
# Load Immediate Signed/Unsigned/High
#

  LDI:
    category: "imm"
    opcode: 0
    operation: "ImmOp_Load_C"
    behaviour: "R[rd] = sign_extend(value)"

  LDIU:
    category: "imm_unsigned"
    opcode: 1
    operation: "ImmOp_Load_C"
    behaviour: "R[rd] = zero_extend(value)"

  LDIH:
    category: "imm_high"
    opcode: 2
    operation: "ImmOp_Load_C"
    behaviour: "R[rd] = zero_pad(value)"

#
# Load/Store Indirect Displaced
#

  LD:
    category: "loadstore"
    opcode: 0
    size: "Log2BPW_C"
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  LDL:
    category: "loadstore"
    opcode: 1
    size: 2
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  LDLU:
    category: "loadstore"
    opcode: 2
    size: 2
    operation: "LSOp_LoadUnsigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  LDS:
    category: "loadstore"
    opcode: 3
    size: 1
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  LDSU:
    category: "loadstore"
    opcode: 4
    size: "1"
    operation: "LSOp_LoadUnsigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  LDB:
    category: "loadstore"
    opcode: 5
    size: 0
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  LDBU:
    category: "loadstore"
    opcode: 6
    size: 0
    operation: "LSOp_LoadUnsigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"

  ST:
    category: "loadstore"
    opcode: 7
    size: "Log2BPW_C"
    operation: "LSOp_Store_C"
    behaviour: "MEM[R[s1] + zero_extend(offset)] = R[s2]"
    
  STL:
    category: "loadstore"
    opcode: 8
    size: 2
    operation: "LSOp_Store_C"
    behaviour: "MEM[R[s1] + zero_extend(offset)] = R[s2]"
    
  STS:
    category: "loadstore"
    opcode: 9
    size: 1
    operation: "LSOp_Store_C"
    behaviour: "MEM[R[s1] + zero_extend(offset)] = R[s2]"
    
  STB:
    category: "loadstore"
    opcode: 10
    size: 0
    operation: "LSOp_Store_C"
    behaviour: "MEM[R[s1] + zero_extend(offset)] = R[s2]"

#
# Load/Store, Indirect Indexed
#

  LDX:
    category: "loadstore_indexed"
    opcode: 0
    operation: "LSOp_LoadSigned_C"
    size: "Log2BPW_C"
    behaviour: "R[rd] = MEM[R[s1] + R[s2]*scale]"
    
  LDXL:
    category: "loadstore_indexed"
    opcode: 1
    size: 2
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s1] + R[s2]*scale]"
    
  LDXLU:
    category: "loadstore_indexed"
    opcode: 2
    size: 2
    operation: "LSOp_LoadUnsigned_C"
    behaviour: "R[rd] = MEM[R[s1] + R[s2]*scale]"
    
  LDXS:
    category: "loadstore_indexed"
    opcode: 3
    size: 1
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s1] + R[s2]*scale]"
    
  LDXSU:
    category: "loadstore_indexed"
    opcode: 4
    size: 1    
    operation: "LSOp_LoadUnsigned_C"
    behaviour: "R[rd] = MEM[R[s1] + R[s2]*scale]"
    
  LDXB:
    category: "loadstore_indexed"
    opcode: 5
    size: 0
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s1] + R[s2]*scale]"
    
  LDXBU:
    category: "loadstore_indexed"
    opcode: 6
    size: 0
    operation: "LSOp_LoadUnsigned_C"
    behaviour: "R[rd] = MEM[R[s1] + R[s2]*scale]"

  STX:
    category: "loadstore_indexed"
    opcode: 7
    size: "Log2BPW_C"
    operation: "LSOp_Store_C"
    behaviour: "MEM[R[s1] + R[s2]*scale] = R[d]"
    
  STXL:
    category: "loadstore_indexed"
    opcode: 8
    size: 2
    operation: "LSOp_Store_C"
    behaviour: "MEM[R[s1] + R[s2]*scale] = R[d]"
    
  STXS:
    category: "loadstore_indexed"
    opcode: 9
    size: 1
    operation: "LSOp_Store_C"
    behaviour: "MEM[R[s1] + R[s2]*scale] = R[d]"
    
  STXB:
    category: "loadstore_indexed"
    opcode: 10
    size: 0
    operation: "LSOp_Store_C"
    behaviour: "MEM[R[s1] + R[s2]*scale] = R[d]"

#
# Vector Load, Indirect, Immediate Stride
#

  VLDI:
    category: "loadstore_vec_imm"
    opcode: 0
    size: "Log2BPW_C"
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VLDIL:
    category: "loadstore_vec_imm"
    opcode: 1
    size: 2
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VLDILU:
    category: "loadstore_vec_imm"
    opcode: 2
    size: 2
    operation: "LSOp_LoadUnsigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VLDIS:
    category: "loadstore_vec_imm"
    opcode: 3
    size: 1
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VLDISU:
    category: "loadstore_vec_imm"
    opcode: 4
    size: 1
    operation: "LSOp_LoadUnsigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VLDIB:
    category: "loadstore_vec_imm"
    opcode: 5
    size: 0
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VLDIBU:
    category: "loadstore_vec_imm"
    opcode: 6
    size: 0
    operation: "LSOp_LoadUnsigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"

#
# Vector Store, Indirect, Immediate Stride
#

  VSTI:
    category: "loadstore_vec_imm"
    opcode: 7
    size: "Log2BPW_C"
    operation: "LSOp_Store_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VSTIL:
    category: "loadstore_vec_imm"
    opcode: 8
    size: 2
    operation: "LSOp_Store_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VSTIS:
    category: "loadstore_vec_imm"
    opcode: 9
    size: 1
    operation: "LSOp_Store_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VSTIB:
    category: "loadstore_vec_imm"
    opcode: 10
    size: 0
    operation: "LSOp_Store_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"

#
# Vector Load, Indirect, Stride
#

  VLD:
    category: "loadstore_vec"
    opcode: 11
    size: "Log2BPW_C"
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VLDL:
    category: "loadstore_vec"
    opcode: 12
    size: 2
    operation: "LSOp_LoadSigned_C"
    behaviour: "R[rd] = MEM[R[s] + zero_extend(offset)]"
    
  VLDLU:
    category: "loadstore_vec"
