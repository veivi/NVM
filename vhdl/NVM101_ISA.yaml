#

  VBAND:
    category: "logic_vec_bc"
    opcode: 13
    operation: "ALUOp_AND_C"
    behaviour: "R[rd] = R[rs1] AND R[rs2]"

  VBXOR:
    category: "logic_vec_bc"
    opcode: 14
    operation: "ALUOp_XOR_C"
    behaviour: "R[rd] = R[rs1] XOR R[rs2]"

  VBADD:
    category: "logic_vec_bc"
    opcode: 15
    operation: "ALUOp_ADD_C"
    behaviour: "R[rd] = R[rs1] + R[rs2]"

  VBSUB:
    category: "logic_vec_bc"
    opcode: 16
    operation: "ALUOp_SUB_C"
    behaviour: "R[rd] = R[rs1] - R[rs2]"

  VBOR:
    category: "logic_vec_bc"
    opcode: 17
    operation: "ALUOp_OR_C"
    behaviour: "R[rd] = R[rs1] OR R[rs2]"

  VBLSL:
